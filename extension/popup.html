<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fff; --line: #e5e5ea; --accent: #fa2d48; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #98989d; --bg: #1c1c1e; --line: #38383a; } }
    body { margin: 0; width: 300px; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    header { padding: 14px 16px 10px; font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--line); }
    section { padding: 12px 16px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
    .label { color: var(--muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #8e8e93; vertical-align: 1px; }
    .ok { background: #30d158; } .warn { background: #ff9f0a; } .bad { background: #ff453a; }
    .track { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--fg) 6%, transparent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    form { display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding: 12px 16px; }
    input { width: 80px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; }
    button { padding: 5px 10px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    .hint { color: var(--muted); font-size: 12px; padding: 0 16px 12px; }
  </style>
</head>
<body>
  <header>Apple Music → DeskThing</header>
  <section>
    <div class="row"><span class="label">DeskThing app</span><span id="ws"><span class="dot"></span>—</span></div>
    <div class="row"><span class="label">Apple Music tabs</span><span id="tabs">—</span></div>
    <div class="track" id="track">Nothing playing</div>
  </section>
  <form id="f">
    <span class="label">Port</span>
    <input id="port" type="number" min="1024" max="65535" />
    <button type="submit">Save &amp; reconnect</button>
  </form>
  <div class="hint">Must match the “Bridge port” setting of the Apple Music app in DeskThing (default 8899).</div>
  <script src="popup.js"></script>
</body>
</html>
